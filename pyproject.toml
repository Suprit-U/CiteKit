[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citekit"
version = "0.1.0"
description = "Verifiable retrieval-augmented Q&A: every answer carries a citation, and the system abstains when the corpus does not support it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suprit U" }]
keywords = ["rag", "retrieval", "citations", "abstention", "evaluation", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
citekit = "citekit.cli:main"

[project.urls]
Homepage = "https://github.com/Suprit-U/CiteKit"
Issues = "https://github.com/Suprit-U/CiteKit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"